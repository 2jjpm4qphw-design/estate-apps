<!-- Desk Clock — estate-apps/desk-clock, staged 20 Sep 2026 from _Source/Desk Clock.html.
     MASTER IS _Source/Desk Clock.html. Edit there, restage; do not edit this copy in place,
     which is how the Hub and its builds diverged in June.
     The Google Fonts link stays: the sandbox cannot reach fonts.gstatic.com to download the
     woff2, so the service worker caches the font cross-origin on first load instead. One
     online launch and the clock keeps Cormorant through every reboot after it. -->
<title>Connolly Desk Clock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
  /* Single-look design: black ground for an OLED screen behind a frame mount. */
  :root {
    --ground: #000000;
    --ivory: #E8DFCB;
    --ivory-dim: #857D6C;
    --ivory-faint: #3A362F;
    --brass: #B8955A;
    --brass-deep: #7C6238;
    --serif: "Cormorant Garamond", "Baskerville", "Hoefler Text", Georgia, serif;
  }
  html, body { height: 100%; background: var(--ground); color: var(--ivory); }
  body { margin: 0; overflow: hidden; font-family: var(--serif);
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
         cursor: default; }

  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0;
           padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
           display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center;
           -webkit-box-pack: center; justify-content: center; }
  #shift { -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%; }

  /* ---------- Dial + calendar (landscape default) ---------- */
  #dialMode { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; padding-left: 10.5vmin; }
  .face { position: relative; }
  /* Crest sits outside the dial, top-left, clear of the ring. */
  .face .crest { position: absolute; top: 0; right: 100%; margin-right: 1.6vmin;
                 width: 8.9vmin; height: auto; opacity: .92; }
  #dial { width: 72vmin; height: 72vmin; display: block; }
  #cal { margin-left: 7vmin; width: 60vmin; }

  .month { font-weight: 600; font-size: 5.2vmin; letter-spacing: .32em; text-transform: uppercase;
           color: var(--brass); margin: 0 0 3.2vmin 0.5vmin; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-row-gap: 1.2vmin; }
  .grid span { display: block; text-align: center; font-size: 5vmin; line-height: 7.4vmin; height: 7.4vmin;
               font-weight: 500; font-variant-numeric: lining-nums tabular-nums; color: var(--ivory); }
  .grid .wd { font-size: 3.3vmin; letter-spacing: .12em; color: var(--ivory-dim); font-weight: 600; }
  .grid .we { color: var(--ivory-dim); }
  .grid .today { position: relative; color: #000; font-weight: 600; }
  .grid .today:before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
           width: 7vmin; height: 7vmin; margin: -3.5vmin 0 0 -3.5vmin; border-radius: 50%;
           background: var(--brass); }
  .grid { position: relative; z-index: 0; }

  .readout { margin-top: 3.6vmin; padding-top: 2.6vmin; border-top: 1px solid var(--ivory-faint);
             display: -webkit-box; display: flex; -webkit-box-align: baseline; align-items: baseline;
             -webkit-box-pack: justify; justify-content: space-between; }
  .readout .t { font-size: 7.4vmin; font-weight: 500; font-variant-numeric: lining-nums tabular-nums;
                letter-spacing: .02em; }
  .readout .d { font-size: 3.5vmin; letter-spacing: .2em; text-transform: uppercase; color: var(--ivory-dim);
                font-weight: 600; }

  /* ---------- Large digital mode ---------- */
  #digiMode { text-align: center; }
  #digiMode img { width: 8.1vmin; height: auto; display: block; margin: 0 auto 3vmin; opacity: .9; }
  .big { font-size: 36vmin; line-height: 1; font-weight: 500; letter-spacing: -.01em;
         font-variant-numeric: lining-nums tabular-nums; }
  .big .colon { color: var(--brass); position: relative; top: -.06em; padding: 0 .02em; }
  .big-date { margin-top: 3vmin; font-size: 4.4vmin; letter-spacing: .34em; text-transform: uppercase;
              color: var(--brass); font-weight: 600; }

  /* ---------- Portrait: stack ---------- */
  @media (orientation: portrait) {
    #dialMode { -webkit-box-orient: vertical; flex-direction: column; padding-left: 0; }
    #dial { width: 78vmin; height: 78vmin; }
    /* Upright there's no room beside the dial, so the crest tucks into the
       dial's empty top-left corner, clear of the ring. */
    .face .crest { right: auto; left: 0; margin-right: 0; }
    #cal { margin: 7vmin 0 0 0; width: 78vmin; }
    .big { font-size: 30vmin; }
  }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #shift { transition: none; -webkit-transition: none; } }
</style>
</head>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August",
                "September","October","November","December"];
  // Clockmakers write four as IIII, not IV.
  var ROMAN = ["XII","I","II","III","IIII","V","VI","VII","VIII","IX","X","XI"];
  // 24-hour by default. Add ?h=12 to the address for a 12-hour readout.
  var H12 = /[?&]h=12\b/.test(location.search);

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // ---- Build the dial once ----
  var ticks = document.getElementById("ticks");
  el("circle", { r: 96, fill: "none", stroke: "#7C6238", "stroke-width": 0.6 }, ticks);
  for (var i = 0; i < 60; i++) {
    var a = i * 6 * Math.PI / 180, hour = i % 5 === 0;
    var r1 = hour ? 84 : 88.5, r2 = 93;
    el("line", {
      x1: (Math.sin(a) * r1).toFixed(2), y1: (-Math.cos(a) * r1).toFixed(2),
      x2: (Math.sin(a) * r2).toFixed(2), y2: (-Math.cos(a) * r2).toFixed(2),
      stroke: hour ? "#E8DFCB" : "#5E584C", "stroke-width": hour ? 1.6 : 0.7, "stroke-linecap": "round"
    }, ticks);
  }
  var nums = document.getElementById("numerals");
  for (var h = 0; h < 12; h++) {
    var ang = h * 30 * Math.PI / 180, rr = 71;
    var t = el("text", {
      x: (Math.sin(ang) * rr).toFixed(2),
      y: (-Math.cos(ang) * rr + 4.6).toFixed(2),
      "font-size": ROMAN[h].length > 3 ? 11 : 13
    }, nums);
    t.textContent = ROMAN[h];
  }

  var hHour = document.getElementById("hHour"),
      hMin  = document.getElementById("hMin"),
      hSec  = document.getElementById("hSec");

  // ---- Calendar ----
  var lastDay = -1;
  function buildCalendar(now) {
    document.getElementById("month").textContent = MONTHS[now.getMonth()];
    var grid = document.getElementById("grid"), html = "";
    var heads = ["M","T","W","T","F","S","S"];
    for (var i = 0; i < 7; i++) html += '<span class="wd">' + heads[i] + "</span>";
    var first = new Date(now.getFullYear(), now.getMonth(), 1);
    var lead = (first.getDay() + 6) % 7;                     // Monday-first, as in the UK
    var len = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    for (var b = 0; b < lead; b++) html += "<span></span>";
    for (var d = 1; d <= len; d++) {
      var col = (lead + d - 1) % 7, cls = [];
      if (col >= 5) cls.push("we");
      if (d === now.getDate()) cls.push("today");
      html += '<span class="' + cls.join(" ") + '">' + d + "</span>";
    }
    grid.innerHTML = html;
  }

  function timeText(now) {
    var hh = now.getHours();
    if (H12) { hh = hh % 12; if (hh === 0) hh = 12; return { h: "" + hh, m: pad(now.getMinutes()) }; }
    return { h: pad(hh), m: pad(now.getMinutes()) };
  }

  // ---- Tick ----
  function tick() {

    hSec.setAttribute("transform", "rotate(" + (s * 6) + ")");
    hMin.setAttribute("transform", "rotate(" + (m * 6 + s * 0.1) + ")");
    hHour.setAttribute("transform", "rotate(" + (hr * 30 + m * 0.5) + ")");

    var tt = timeText(now);
    document.getElementById("rt").textContent = tt.h + ":" + tt.m;
    document.getElementById("rd").textContent = DAYS[now.getDay()];
    document.getElementById("big").innerHTML = tt.h + '<span class="colon">:</span>' + tt.m;
    document.getElementById("bigDate").textContent =
      DAYS[now.getDay()] + " " + now.getDate() + " " + MONTHS[now.getMonth()];

    if (now.getDate() !== lastDay) { lastDay = now.getDate(); buildCalendar(now); }

    setTimeout(tick, 1000 - now.getMilliseconds() + 15);

    var cs = window.getComputedStyle(stage);
    var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var w = box.offsetWidth, h = box.offsetHeight;
    if (!w || !h) return;
    sc = Math.min(1, (W * 0.94) / w, (H * 0.94) / h);
    apply();
  }
  function nudge() {
    nx = Math.round(Math.random() * 8 - 4); ny = Math.round(Math.random() * 8 - 4);
    apply();
  }
  setInterval(nudge, 60000);
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); } catch (e) {}
  setTimeout(fit, 1000);

  // ---- Tap to switch face; remembered on this phone ----
  function setMode(m) {
    dialMode.hidden = (m === "digital"); digiMode.hidden = (m !== "digital");
    try { localStorage.setItem("clockMode", m); } catch (e) {}
    fit();
  }
  var saved = null;
  try { saved = localStorage.getItem("clockMode"); } catch (e) {}
  setMode(saved === "digital" ? "digital" : "dial");
  stage.addEventListener("click", function () {
    setMode(dialMode.hidden ? "dial" : "digital");
  });

  // ---- Keep the screen awake where the browser allows it (Auto-Lock: Never is the real fix) ----
  var lock = null;
  function wake() {
    try {
      if (navigator.wakeLock && document.visibilityState === "visible") {
        navigator.wakeLock.request("screen").then(function (l) { lock = l; }, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener("visibilitychange", wake);
  wake();
})();
</script>

<script>
/* Service worker. THIS APP IS THE ONE THAT ACTUALLY NEEDS ONE — six estate apps skipped it as
   "branding only", but a clock that is on 24/7 in a box frame has to survive a router reboot,
   a power cut and a phone restart with no network. Registered late and guarded: an old iOS that
   has no serviceWorker must still get a working clock. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
  });
})();
</script>
