<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wireless">
<meta name="theme-color" content="#0D1B3E">
<title>The Wireless</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --navy:#0D1B3E; --mid:#1A3A6B; --lime:#C4F000; --mist:#C4CCDD;
    --hair:#24467E; --on-dark:#F4F6FA; --on-dark-muted:#AEB9CF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--on-dark);
    font-family:Montserrat,-apple-system,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{min-height:100vh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{padding:18px 20px 8px;flex:none}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em;color:var(--on-dark)}
  .sub{margin:2px 0 0;font-size:12.5px;color:var(--on-dark-muted)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 12px}

  /* category grid — two columns, big targets for a car */
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  .cat{appearance:none;border:1px solid var(--hair);background:var(--mid);color:var(--on-dark);
    border-radius:14px;padding:20px 14px;font:inherit;font-size:16px;font-weight:500;
    text-align:left;line-height:1.25;min-height:86px;display:flex;flex-direction:column;
    justify-content:flex-end;gap:4px;cursor:pointer}
  .cat small{font-size:11.5px;color:var(--on-dark-muted);font-weight:400}
  .cat[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--navy)}
  .cat[aria-pressed="true"] small{color:#2b3a00}

  /* now playing */
  .np{position:sticky;bottom:0;flex:none;background:var(--navy);
    border-top:1px solid var(--hair);padding:12px 16px 16px}
  .np-stn{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--on-dark-muted);margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-station{font-size:17px;font-weight:600;line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-meta{font-size:13px;color:var(--on-dark-muted);margin-top:2px;min-height:17px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* which line is the track and which is the artist — spelled out, not left to convention */
  .tag{display:inline-block;color:var(--lime);font-weight:700;font-size:11px;
    margin-right:7px;vertical-align:1px}
  .controls{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
  .btn{appearance:none;border:1px solid var(--hair);background:var(--mid);color:var(--on-dark);
    border-radius:12px;padding:16px 8px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
    min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn.primary{background:var(--lime);border-color:var(--lime);color:var(--navy);font-weight:600}
  .btn:disabled{opacity:.4}
  .btn{grid-column:span 2}
  .btn.half{grid-column:span 3}
  .btn.wide{grid-column:1 / -1}
  .btn.on{background:var(--lime);border-color:var(--lime);color:var(--navy);font-weight:600}
  .cat.favtile{grid-column:1 / -1;min-height:64px}

  /* station list — you should always be able to SEE what you can play */
  .backbtn{appearance:none;border:1px solid var(--hair);background:transparent;color:var(--on-dark-muted);
    border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;margin:4px 0 10px;cursor:pointer}
  .listhead{font-size:13px;color:var(--on-dark-muted);margin:0 0 8px;line-height:1.4}
  .strow{border:1px solid var(--hair);background:var(--mid);border-radius:12px;margin-bottom:10px;
    display:flex;align-items:stretch;overflow:hidden;min-height:64px}
  .strow .sp{appearance:none;flex:1;min-width:0;text-align:left;background:none;border:none;
    color:var(--on-dark);font:inherit;padding:12px 14px;cursor:pointer}
  .strow .sp b{display:block;font-size:15px;font-weight:500;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strow .sp span{display:block;font-size:11.5px;color:var(--on-dark-muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strow .sa{appearance:none;flex:none;width:52px;background:none;border:none;border-left:1px solid var(--hair);
    color:var(--on-dark-muted);font:inherit;font-size:18px;cursor:pointer}
  .strow .sa.on{color:var(--lime)}
  .strow .sa.ban{color:#FFB4A8}
  .strow.playing{border-color:var(--lime)}
  .strow.playing .sp b{color:var(--lime)}

  .status{font-size:12px;color:var(--on-dark-muted);margin-top:10px;min-height:15px}
  .status.err{color:#FFB4A8}
  .empty{color:var(--on-dark-muted);font-size:13.5px;line-height:1.55;padding:12px 2px}
  .banned{margin-top:14px;font-size:12px;color:var(--on-dark-muted)}
  .link{color:var(--lime);text-decoration:underline;background:none;border:none;font:inherit;
    font-size:12px;padding:0;cursor:pointer}
  .spike{margin:14px 0 0;padding:10px 12px;border:1px dashed var(--hair);border-radius:10px;
    font-size:12px;color:var(--on-dark-muted);line-height:1.5}

/* estate strip — the house mark and the department, identical on every app (15 Aug 2026) */
.estate-strip{display:flex;align-items:center;gap:9px;padding:9px 16px 0;flex:none}
.estate-strip .em-house{height:13px;width:auto;flex:none;opacity:.9}
.estate-strip .em-dept{font-family:Montserrat,-apple-system,Helvetica,Arial,sans-serif;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#C4F000;line-height:1}
@media print{.estate-strip{display:none}}
</style>
</head>

<header>
  <h1>The Wireless</h1>
  <p class="sub">Music, not talk. For driving, and for getting things done.</p>
</header>

<main>
  <div class="cats" id="cats"></div>
  <div id="list" hidden>
    <button class="backbtn" id="btnBack">‹ All categories</button>
    <p class="listhead" id="listhead"></p>
    <div id="rows"></div>
  </div>
  <div class="banned" id="bannedWrap" hidden>
    <span id="bannedCount"></span> · <button class="link" id="resetBanned">reset</button>
  </div>
</main>

<section class="np">
  <div class="np-stn" id="npStn"></div>
  <div class="np-station" id="npStation">Nothing playing</div>
  <div class="np-meta" id="npMeta"></div>
  <div class="controls">
    <button class="btn" id="btnPrev">Back</button>
    <button class="btn primary" id="btnPlay">Play</button>
    <button class="btn" id="btnNext">Next</button>
    <button class="btn half" id="btnFav">☆ Favourite</button>
    <button class="btn half" id="btnBan">Not this</button>
  </div>
  <div class="status" id="status"></div>
</section>

<audio id="audio" preload="none" playsinline crossorigin="anonymous"></audio>

<script>
(function(){
  'use strict';

  // ---- curated seeds -------------------------------------------------------
  // Chosen because they are genuinely announcer-free: SomaFM is listener-funded with no ads
  // and no DJs; Radio Paradise has no chat; the Swiss public streams announce the track and
  // nothing else. All https, because a page served over https cannot play http audio.
  // Some URLs may have moved — anything that fails is skipped automatically.
  var SEEDS = {
    classical: [
      ['Radio Swiss Classic',      'https://stream.srg-ssr.ch/m/rsc_de/mp3_128'],
      ['Venice Classic Radio',     'https://uk2.streamingpulse.com/ssl/vcr1'],
      ['SomaFM · Drone Zone',      'https://ice1.somafm.com/dronezone-128-mp3']
    ],
    driving: [
      ['Radio Paradise · Main',    'https://stream.radioparadise.com/mp3-192'],
      ['SomaFM · Boot Liquor',     'https://ice1.somafm.com/bootliquor-128-mp3'],
      ['Radio Paradise · Global',  'https://stream.radioparadise.com/global-192']
    ],
    rock: [
      ['Radio Paradise · Rock',    'https://stream.radioparadise.com/rock-192'],
      ['SomaFM · Left Coast 70s',  'https://ice1.somafm.com/seventies-128-mp3'],
      ['SomaFM · Metal Detector',  'https://ice1.somafm.com/metal-128-mp3']
    ],
    eighties: [
      ['SomaFM · Underground 80s', 'https://ice1.somafm.com/u80s-128-mp3'],
      ['Radio Swiss Pop',          'https://stream.srg-ssr.ch/m/rsp/mp3_128']
    ],
    lofi: [
      ['SomaFM · Groove Salad',    'https://ice1.somafm.com/groovesalad-128-mp3'],
      ['SomaFM · Fluid',           'https://ice1.somafm.com/fluid-128-mp3'],
      ['SomaFM · Deep Space One',  'https://ice1.somafm.com/deepspaceone-128-mp3'],
      ['SomaFM · Lush',            'https://ice1.somafm.com/lush-128-mp3']
    ],
    ballads: [
      ['Radio Paradise · Mellow',  'https://stream.radioparadise.com/mellow-192'],
      ['Radio Swiss Pop',          'https://stream.srg-ssr.ch/m/rsp/mp3_128']
    ],
    // Rat Pack / Ella / Nina territory: lounge, standards and vocal jazz.
    standards: [
      ['SomaFM · Illinois St Lounge','https://ice1.somafm.com/illstreet-128-mp3'],
      ['Radio Swiss Jazz',          'https://stream.srg-ssr.ch/m/rsj/mp3_128'],
      ['SomaFM · Secret Agent',     'https://ice1.somafm.com/secretagent-128-mp3']
    ],
    // Ibiza / beach / sunset. Downtempo and deep house rather than club.
    balearic: [
      ['SomaFM · Beat Blender',    'https://ice1.somafm.com/beatblender-128-mp3'],
      ['SomaFM · Groove Salad',    'https://ice1.somafm.com/groovesalad-128-mp3'],
      ['Radio Paradise · Mellow',  'https://stream.radioparadise.com/mellow-192']
    ],
    // No dependable announcer-free yacht-rock station exists by name, so this one
    // leans on the live database. Expect to prune it with "Not this".
    yacht: [
      ['Radio Paradise · Mellow',  'https://stream.radioparadise.com/mellow-192'],
      ['SomaFM · Left Coast 70s',  'https://ice1.somafm.com/seventies-128-mp3']
    ],
    // ADHD working music: no lyrics, modern, keeps a pulse. Deliberately NOT ambient
    // (drifts, stops holding you) and NOT binaural beats (Mark ruled those out).
    focus: [
      ['SomaFM · DEF CON Radio',   'https://ice1.somafm.com/defcon-128-mp3'],
      ['SomaFM · The Trip',        'https://ice1.somafm.com/thetrip-128-mp3'],
      ['Nightride FM · Synthwave', 'https://stream.nightride.fm/nightride.mp3'],
      ['SomaFM · cliqhop idm',     'https://ice1.somafm.com/cliqhop-128-mp3'],
      ['SomaFM · Space Station',   'https://ice1.somafm.com/spacestation-128-mp3']
    ],
    // Current pop WITHOUT presenters. Note: this is not the Official UK Chart —
    // every UK chart station is built around DJs, ads and phone-ins.
    chart: [
      ['Radio Swiss Pop',          'https://stream.srg-ssr.ch/m/rsp/mp3_128']
    ]
  };

  // Live top-up from the open Radio Browser database, by tag.
  var TAGS = {
    classical: ['classical','symphonic'],
    driving:   ['classic rock','rock','driving'],
    rock:      ['classic rock','rock'],
    eighties:  ['80s','1980s'],
    lofi:      ['lofi','ambient','chillout','downtempo'],
    ballads:   ['soft rock','love songs','ballads'],
    standards: ['jazz','vocal jazz','swing','lounge','easy listening'],
    balearic:  ['chillout','ibiza','balearic','lounge','downtempo'],
    yacht:     ['yacht rock','soft rock','aor','70s'],
    chart:     ['top 40','charts','pop','hits'],
    focus:     ['instrumental','electronic','synthwave','idm','techno','deep house']
  };

  // Focus is the one category where a vocal track defeats the point, so the live top-up
  // is filtered harder than the talk filter alone manages.
  var EXCLUDE = {
    focus: /\b(vocal|pop|hits|rap|hip.?hop|r&b|rnb|country|singer|acoustic|karaoke|binaural)\b/i
  };

  var CATS = [
    ['focus',    'Focus',          'no words, keeps moving'],
    ['classical','Classical',      'strings, no chatter'],
    ['driving',  'Driving',        'miles and momentum'],
    ['rock',     'Classic rock',   'guitars, no phone-ins'],
    ['eighties', '1980s',          'the good decade'],
    ['lofi',     'Lo-fi',          'dublab-ish, low and slow'],
    ['ballads',  'Power ballads',  'unapologetic'],
    ['standards','Standards',      'Ella, Nina, the Rat Pack'],
    ['yacht',    'Yacht rock',     'smooth, 1980s, slightly daft'],
    ['balearic', 'Balearic',       'Ibiza sunset, beach, chill'],
    ['chart',    'Chart',          'current pop, no presenters']
  ];

  // Anything with these in the name or tags is talk radio in disguise.
  var TALK = /\b(talk|news|sport|chat|phone|call\s?in|discussion|debate|politic|comedy|podcast|gospel|preach|religio|christian|quran|bible)\b/i;

  var BAN_KEY = 'wireless:banned', CAT_KEY = 'wireless:cat', FAV_KEY = 'wireless:favs';

  // Favourites are kept whole (name + url), not as a reference to a category list, so a
  // favourite still works if the station later drops out of the live database.
  function favs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch(e){ return []; } }
  function isFav(u){ return favs().some(function(f){ return f.url===u; }); }
  function toggleFav(i){
    if(typeof i!=='number'){
      // Silence here reads as a broken button: if nothing is playing there is nothing to keep.
      if(idx<0 || !stations[idx]){ say('Play a station first, then press ☆ to keep it.'); return; }
      i = idx;
    }
    if(!stations[i]) return;
    var s=stations[i], f=favs(), at=-1;
    f.forEach(function(x,i){ if(x.url===s.url) at=i; });
    if(at>=0){ f.splice(at,1); markDeleted(s.url); say('Removed from favourites'); }
    else { f.push({name:s.name, url:s.url, from: s.from || catLabel(cat), at: Date.now()});
           unmarkDeleted(s.url); say('Saved to favourites', false, true); }
    try{ localStorage.setItem(FAV_KEY, JSON.stringify(f)); }catch(e){}
    wgSchedulePush();
    paintFav(); paintCats(); if(view==='list') renderRows();
  }
  function paintFav(){
    var b=document.getElementById('btnFav');
    var on = idx>=0 && stations[idx] && isFav(stations[idx].url);
    b.textContent = on ? '★ Favourite' : '☆ Favourite';
    b.className = 'btn half' + (on ? ' on' : '');
  }

  var audio  = document.getElementById('audio');
  var elCats = document.getElementById('cats');
  var elSt   = document.getElementById('npStation');
  var elMeta = document.getElementById('npMeta');
  var elStat = document.getElementById('status');

  var stations = [], idx = -1, cat = null, loading = false, view = 'cats';
  // Six is a choice you can make at a glance; ten is a list you have to read.
  var pool = [], MAX_PER_CAT = 6;

  function catLabel(key){
    if(key==='__fav') return 'Favourites';
    for(var i=0;i<CATS.length;i++){ if(CATS[i][0]===key) return CATS[i][1]; }
    return '';
  }
  function showCats(){
    view='cats'; cat=null;
    document.getElementById('cats').hidden=false;
    document.getElementById('list').hidden=true;
    paintCats();
  }
  function refreshHead(){
    var el=document.getElementById('listhead'); if(!el) return;
    el.textContent = catLabel(cat) + ' · ' + stations.length
      + (stations.length===1?' station':' stations')
      + (pool.length ? ' · ' + pool.length + ' more in reserve' : '')
      + (cat==='__fav' ? '' : ' · press “Not this” to drop one and pull in another');
  }
  function showList(){
    view='list';
    try{ var m=document.querySelector('main'); if(m) m.scrollTop=0; window.scrollTo(0,0); }catch(e){}
    document.getElementById('cats').hidden=true;
    document.getElementById('list').hidden=false;
    refreshHead();
    renderRows();
  }
  // Every station visible and tappable — you should never have to hunt with Next.
  function renderRows(){
    var el=document.getElementById('rows'); if(!el) return;
    if(!stations.length){
      el.innerHTML='<p class="listhead">'+(cat==='__fav'
        ? ('No favourites kept yet. Play a station from any category and press \u2606 Favourite to add it here.<br><br>' + (wgCreds() ? 'These sync between your phone and your Mac.' : 'These are stored on this device only \u2014 open a synced estate app once to switch syncing on.'))
        : 'Nothing here yet.')+'</p>';
      return; }
    el.innerHTML = stations.map(function(s,i){
      var sub = s.fav ? ('Favourite' + (s.from ? ' · from ' + s.from : ''))
                      : (s.seed ? 'Known talk-free' : 'From the station database');
      var on = isFav(s.url);
      return '<div class="strow'+(i===idx?' playing':'')+'">'
           + '<button class="sp" data-play="'+i+'"><b>'+esc(s.name)+'</b><span>'+esc(sub)+'</span></button>'
           + '<button class="sa'+(on?' on':'')+'" data-favi="'+i+'" aria-label="Favourite">'+(on?'★':'☆')+'</button>'
           + '<button class="sa ban" data-bani="'+i+'" aria-label="Not this">\u00d7</button>'
           + '</div>';
    }).join('');
  }
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function banned(){ try{ return JSON.parse(localStorage.getItem(BAN_KEY)||'[]'); }catch(e){ return []; } }
  function isBanned(u){ return banned().indexOf(u) !== -1; }
  function ban(u){ var b=banned(); if(b.indexOf(u)===-1){ b.push(u); localStorage.setItem(BAN_KEY, JSON.stringify(b)); } paintBanned(); wgSchedulePush(); }
  function paintBanned(){
    var n = banned().length, w = document.getElementById('bannedWrap');
    w.hidden = !n;
    document.getElementById('bannedCount').textContent = n + (n===1?' station muted for good':' stations muted for good');
  }

  // ---- syncing favourites between devices ----------------------------------
  // Every other estate app follows you between the phone and the Mac; this one did not, so
  // you would build one set of favourites in the car and a different set at the desk.
  // All the apps are served from the same address, so the Gist credentials you entered in the
  // Library or the Still Room are already here — nothing to set up.
  // Own-file pattern (wireless.json), as Roadcraft and the Form Book use, so the Hub's own
  // state is never touched. Removals carry a tombstone, or a union merge would quietly
  // resurrect anything you deleted on the other device — the mistake the Hub already made once.
  var GID='connolly-sync:gist-id', GTOK='connolly-sync:token', GFILE='wireless.json';
  var DEL_KEY='wireless:del', _pushTimer=null, _syncing=false;
  function wgCreds(){ try{ var i=localStorage.getItem(GID), t=localStorage.getItem(GTOK);
    return (i&&t)?{id:i,token:t}:null; }catch(e){ return null; } }
  function dels(){ try{ return JSON.parse(localStorage.getItem(DEL_KEY)||'{}'); }catch(e){ return {}; } }
  function setDels(d){ try{ localStorage.setItem(DEL_KEY, JSON.stringify(d)); }catch(e){} }
  function markDeleted(url){ var d=dels(); d[url]=Date.now(); setDels(d); }
  function unmarkDeleted(url){ var d=dels(); delete d[url]; setDels(d); }

  function wgLocal(){
    var f={}, now=Date.now();
    favs().forEach(function(x){ f[x.url]={name:x.name, from:x.from||'', at:x.at||now}; });
    return { favs:f, bans:banned(), del:dels(), savedAt:new Date().toISOString() };
  }
  // An entry survives only if it was favourited more recently than it was removed.
  function wgMerge(remote){
    if(!remote||typeof remote!=='object') return false;
    var localF={}, changed=false;
    favs().forEach(function(x){ localF[x.url]=x; });
    var d=dels(), rd=remote.del||{};
    Object.keys(rd).forEach(function(u){ if(!d[u]||rd[u]>d[u]){ d[u]=rd[u]; changed=true; } });
    var rf=remote.favs||{};
    Object.keys(rf).forEach(function(u){
      var at=rf[u].at||0;
      if(d[u] && d[u]>=at) return;                    // deleted here, and more recently
      if(!localF[u]){ localF[u]={name:rf[u].name, url:u, from:rf[u].from||'', at:at}; changed=true; }
    });
    Object.keys(localF).forEach(function(u){ if(d[u] && d[u]>=(localF[u].at||0)){ delete localF[u]; changed=true; } });
    var merged=Object.keys(localF).map(function(u){ return localF[u]; });
    var b=banned(), rb=Array.isArray(remote.bans)?remote.bans:[];
    rb.forEach(function(u){ if(b.indexOf(u)===-1){ b.push(u); changed=true; } });
    if(changed){
      try{ localStorage.setItem(FAV_KEY, JSON.stringify(merged));
           localStorage.setItem(BAN_KEY, JSON.stringify(b)); setDels(d); }catch(e){}
    }
    return changed;
  }
  function wgPull(){
    var c=wgCreds(); if(!c) return;
    fetch('https://api.github.com/gists/'+c.id,{headers:{Authorization:'Bearer '+c.token,
      Accept:'application/vnd.github+json'},cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('gist '+r.status); return r.json(); })
      .then(function(g){
        var f=g.files&&g.files[GFILE]; if(!f) return null;
        if(f.truncated&&f.raw_url) return fetch(f.raw_url).then(function(r){return r.text();});
        return f.content;
      })
      .then(function(txt){
        if(!txt) return;
        if(wgMerge(JSON.parse(txt))){ paintCats(); paintFav(); if(view==='list'){ stations=seedList(cat); renderRows(); }
          say('Favourites updated from your other device'); }
      })
      .catch(function(e){ try{ console.warn('[wireless] sync pull failed', e); }catch(_){} });
  }
  function wgPush(){
    var c=wgCreds(); if(!c || _syncing) return;
    _syncing=true;
    var body={files:{}}; body.files[GFILE]={content:JSON.stringify(wgLocal(),null,1)};
    fetch('https://api.github.com/gists/'+c.id,{method:'PATCH',
      headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)})
      .then(function(r){ if(!r.ok) throw new Error('gist '+r.status); })
      .catch(function(e){ try{ console.warn('[wireless] sync push failed', e); }catch(_){} })
      .then(function(){ _syncing=false; });
  }
  function wgSchedulePush(){ if(!wgCreds()) return; if(_pushTimer) clearTimeout(_pushTimer);
    _pushTimer=setTimeout(function(){ _pushTimer=null; wgPush(); }, 2000); }

  function wEsc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Some messages must outlive the next station starting, or they are wiped before you read them.
  var _stickUntil = 0;
  function say(msg, isErr, sticky){
    // A sticky message holds the line for a few seconds — routine chatter must not stamp on it.
    if(Date.now() < _stickUntil && !sticky && !isErr) return;
    if(sticky) _stickUntil = Date.now() + 4000;
    elStat.textContent = msg||''; elStat.className = 'status' + (isErr?' err':'');
  }

  function paintCats(){
    elCats.innerHTML = '';
    var fv = favs();
    var f=document.createElement('button');
    f.className='cat favtile'; f.type='button'; f.setAttribute('aria-pressed', String(cat==='__fav'));
    f.innerHTML = fv.length
      ? ('★ Favourites <small>' + fv.length + (fv.length===1?' station you kept':' stations you kept') + '</small>')
      : ('★ Favourites <small>none yet — press \u2606 while a station is playing</small>');
    f.addEventListener('click', function(){
      if(!favs().length){ say('No favourites on this device yet. Play something and press \u2606 to keep it.'); return; }
      pick('__fav');
    });
    elCats.appendChild(f);
    CATS.forEach(function(c){
      var b=document.createElement('button');
      b.className='cat'; b.type='button'; b.setAttribute('aria-pressed', String(cat===c[0]));
      b.innerHTML = c[1] + '<small>' + c[2] + '</small>';
      b.addEventListener('click', function(){ pick(c[0]); });
      elCats.appendChild(b);
    });
  }

  function seedList(key){
    if(key==='__fav') return favs().map(function(f){ return {name:f.name, url:f.url, fav:true, from:f.from||''}; });
    return (SEEDS[key]||[]).map(function(s){ return {name:s[0], url:s[1], seed:true}; })
      .filter(function(s){ return !isBanned(s.url); });
  }

  // Top up from Radio Browser. Never blocks playback — seeds play immediately.
  function topUp(key){
    var tags = TAGS[key]||[];
    if(!tags.length) return;
    var url = 'https://de1.api.radio-browser.info/json/stations/search'
            + '?tagList=' + encodeURIComponent(tags.join(','))
            + '&is_https=true&hidebroken=true&order=clickcount&reverse=true&limit=120';
    fetch(url, {headers:{'User-Agent':'TheWireless/0.1'}})
      .then(function(r){ return r.json(); })
      .then(function(list){
        if(!Array.isArray(list) || cat!==key) return;
        var add = list.filter(function(s){
          if(!s || !s.url_resolved) return false;
          if(s.url_resolved.indexOf('https://')!==0) return false;
          if(isBanned(s.url_resolved)) return false;
          var hay = (s.name||'') + ' ' + (s.tags||'');
          if(TALK.test(hay)) return false;
          if(EXCLUDE[key] && EXCLUDE[key].test(hay)) return false;
          return !stations.some(function(x){ return x.url===s.url_resolved; });
        }).map(function(s){ return {name:(s.name||'Unknown').trim(), url:s.url_resolved}; });
        // Spread across broadcasters rather than ten from whoever is most popular.
        var seen={}; var spread=[];
        add.forEach(function(s){ var host=(s.url.split('/')[2]||'').replace(/^www\./,'');
          seen[host]=(seen[host]||0)+1; if(seen[host]<=2) spread.push(s); });
        add.forEach(function(s){ if(spread.indexOf(s)===-1) spread.push(s); });
        var room = Math.max(0, MAX_PER_CAT - stations.length);
        stations = stations.concat(spread.slice(0, room));
        pool = spread.slice(room);
        if(view==='list'){ refreshHead(); renderRows(); }
        if(add.length) say(stations.length + ' to choose from, ' + pool.length + ' more in reserve');
      })
      .catch(function(){ /* seeds are enough */ });
  }

  function pick(key){
    cat = key; try{ localStorage.setItem(CAT_KEY, key); }catch(e){}
    paintCats();
    stations = seedList(key).slice(0, MAX_PER_CAT); pool = []; idx = -1;
    if(!stations.length){ say(key==='__fav' ? 'No favourites yet — press ☆ on one you like.' : 'Everything here is muted — reset below.', true); return; }
    say('Loading…');
    if(key!=='__fav') topUp(key);
    showList();
    next();
  }

  function play(i){
    if(!stations.length) return;
    idx = (i + stations.length) % stations.length;
    var s = stations[idx];
    document.getElementById('npStn').textContent = s.name;      // the STATION
    elSt.textContent = s.name;                                   // replaced by the track once known
    elMeta.textContent = '';
    elMeta.textContent = (idx+1) + ' of ' + stations.length + (s.seed ? ' · known talk-free' : (s.fav ? ' · favourite' : ''));
    paintFav(); if(view==='list') renderRows();
    say('Connecting…');
    loading = true;
    audio.src = s.url;
    audio.play().then(function(){
      loading = false; say('');
      document.getElementById('btnPlay').textContent = 'Pause';
      media(s); paintFav(); startNowPlaying(s);
    }).catch(function(){
      loading = false;
      say('That one would not start — trying the next', true);
      setTimeout(function(){ if(!audio.paused) return; next(); }, 400);
    });
  }

  function next(){ play(idx + 1); }
  function prev(){ play(idx - 1); }

  // ---- now playing ---------------------------------------------------------
  // A browser cannot read the track name embedded in the audio stream — it arrives, but the
  // page is never given it. So for the stations that publish a public now-playing feed
  // (SomaFM and Radio Paradise, i.e. most of the curated list) we ask that instead, and put
  // the result on screen AND on the lock screen. Anything else keeps showing the station name.
  var _npTimer=null, _npFor=null;
  function nowPlayingUrl(u){
    var m=u.match(/ice1\.somafm\.com\/([a-z0-9]+)-/i);
    if(m) return {kind:'soma', url:'https://somafm.com/songs/'+m[1]+'.json'};
    var rp={'mp3-192':0,'mellow-192':1,'rock-192':2,'global-192':3};
    m=u.match(/stream\.radioparadise\.com\/([a-z0-9-]+)/i);
    if(m && rp[m[1]]!==undefined) return {kind:'rp', url:'https://api.radioparadise.com/api/now_playing?chan='+rp[m[1]]};
    return null;
  }
  function stopNowPlaying(){ if(_npTimer){ clearInterval(_npTimer); _npTimer=null; } _npFor=null; }
  function startNowPlaying(s){
    stopNowPlaying();
    var src=nowPlayingUrl(s.url); if(!src) return;
    _npFor=s.url;
    var tick=function(){
      if(_npFor!==s.url) return;
      fetch(src.url, {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
        if(_npFor!==s.url || !j) return;
        var artist='', title='';
        if(src.kind==='soma' && j.songs && j.songs.length){ artist=j.songs[0].artist||''; title=j.songs[0].title||''; }
        if(src.kind==='rp'){ artist=j.artist||''; title=j.title||''; }
        if(!title) return;
        elSt.innerHTML   = '<span class="tag">t</span>' + wEsc(title);          // t = track
        elMeta.innerHTML = artist ? ('<span class="tag">a</span>' + wEsc(artist)) : '';  // a = artist
        if('mediaSession' in navigator){
          try{
            navigator.mediaSession.metadata = new MediaMetadata({
              title: title, artist: artist || s.name, album: s.name,
              artwork: [{src:'./icon-512.png', sizes:'512x512', type:'image/png'}]
            });
          }catch(e){}
        }
      }).catch(function(err){
        // Most likely the station's now-playing feed refuses cross-site requests (CORS).
        // Say so once, quietly, rather than leaving a blank line that looks like a bug.
        try{ console.warn('[wireless] now-playing lookup failed for ' + s.name + ' via ' + src.url, err); }catch(e){}
        if(_npFor===s.url && !elMeta.textContent){ elMeta.textContent = 'Track details not published by this station'; }
        stopNowPlaying();
      });
    };
    tick();
    _npTimer=setInterval(tick, 25000);   // stations change track every 3-5 min; 25s is ample
  }

  function media(s){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.name, artist: 'The Wireless',
        album: (CATS.filter(function(c){return c[0]===cat;})[0]||[])[1] || '',
        artwork: [{src:'./icon-512.png', sizes:'512x512', type:'image/png'}]
      });
      navigator.mediaSession.setActionHandler('play',  function(){ audio.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ audio.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack',     function(){ next(); });
      navigator.mediaSession.setActionHandler('previoustrack', function(){ prev(); });
    }catch(e){}
  }

  // A dead stream mid-drive must never leave silence — move on by itself.
  audio.addEventListener('error', function(){ if(!loading && cat) { say('Stream dropped — moving on', true); next(); } });
  audio.addEventListener('stalled', function(){ say('Buffering…'); });
  audio.addEventListener('playing', function(){ say(''); document.getElementById('btnPlay').textContent='Pause'; });
  audio.addEventListener('pause',   function(){ document.getElementById('btnPlay').textContent='Play'; stopNowPlaying(); });

  document.getElementById('btnPlay').addEventListener('click', function(){
    if(!stations.length){ pick(localStorage.getItem(CAT_KEY) || 'driving'); return; }
    if(audio.paused){ audio.play().catch(function(){ next(); }); } else { audio.pause(); }
  });
  document.getElementById('btnBack').addEventListener('click', showCats);
  document.getElementById('rows').addEventListener('click', function(e){
    var t=e.target.closest && e.target.closest('[data-play],[data-favi],[data-bani]'); if(!t) return;
    if(t.hasAttribute('data-play')){ play(parseInt(t.getAttribute('data-play'),10)); return; }
    if(t.hasAttribute('data-favi')){ toggleFav(parseInt(t.getAttribute('data-favi'),10)); return; }
    if(t.hasAttribute('data-bani')){ dropStation(parseInt(t.getAttribute('data-bani'),10)); return; }
  });
  document.getElementById('btnFav').addEventListener('click', toggleFav);
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnPrev').addEventListener('click', prev);
  // Dropping a station: from its own row, or from the bar for whatever is playing.
  function dropStation(i){
    if(typeof i!=='number') i = idx;
    if(i<0 || !stations[i]){ say('Play a station first, or press \u00d7 on one in the list.'); return; }
    var s = stations[i], wasPlaying = (i===idx);
    ban(s.url);
    try{ var f=favs().filter(function(x){ return x.url!==s.url; }); localStorage.setItem(FAV_KEY, JSON.stringify(f)); }catch(e){}
    stations.splice(i,1);
    if(i<idx) idx--; else if(i===idx) idx--;
    var filled='';
    if(pool.length && stations.length<MAX_PER_CAT){ stations.push(pool.shift()); filled=' — replaced'; }
    say('“' + s.name + '” dropped from ' + catLabel(cat) + filled, false, true);
    if(view==='list'){ refreshHead(); renderRows(); }
    // Only jump to another station if the one you dropped was the one playing.
    if(wasPlaying){ if(stations.length) next(); else { audio.pause(); elSt.textContent='Nothing playing'; } }
  }
  document.getElementById('btnBan').addEventListener('click', function(){ dropStation(); });
  document.getElementById('resetBanned').addEventListener('click', function(){
    localStorage.removeItem(BAN_KEY); paintBanned(); say('Muted list cleared');
  });

  paintCats(); paintBanned();
  var last = null; try{ last = localStorage.getItem(CAT_KEY); }catch(e){}
  if(last === '__fav' && favs().length){ cat='__fav'; paintCats(); stations=seedList('__fav'); showList();
    elSt.textContent='Ready — Favourites'; elMeta.textContent='Pick a station'; }
  else if(last && SEEDS[last]){ cat=last; paintCats(); stations=seedList(last); topUp(last); showList();
    elSt.textContent='Ready — ' + catLabel(last); elMeta.textContent='Pick a station'; }

  try{ wgPull(); }catch(e){}
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
})();
</script>
</body>
